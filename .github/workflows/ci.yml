name: MB CI

on:
  push:
    branches: [main, feat/mb-client-ready]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: npm run typecheck 2>&1 | tee validation.log

      - name: Report TypeScript diagnostics
        if: steps.typecheck.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('validation.log', 'utf8');
            const body = `<!-- mb-ci-diagnostics -->\n### MB CI — TypeScript diagnostics\n\n\`\`\`text\n${raw.slice(-60000)}\n\`\`\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes('<!-- mb-ci-diagnostics -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Stop on TypeScript errors
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        env:
          CI: true
        run: npm run build
