name: MB Lint Autofix

on:
  push:
    branches: [feat/mb-client-ready]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[lint-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mb-client-ready
          fetch-depth: 0

      - name: Apply lint fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Remove unused imports.
          path = Path('components/home-page-v2.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace('  UserRound,\n', '').replace('  UsersRound,\n', '')
          path.write_text(text, encoding='utf-8')

          path = Path('components/admin/content-panel.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import { useEffect, useMemo, useState } from "react";', 'import { useEffect, useState } from "react";')
          path.write_text(text, encoding='utf-8')

          # Make Admin auth / booking loading effect-safe and dependency-correct.
          path = Path('components/admin-dashboard-v2.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'import { useEffect, useMemo, useState } from "react";',
              'import { useCallback, useEffect, useMemo, useState } from "react";',
          )
          text = text.replace('const [checking, setChecking] = useState(true);', 'const [checking, setChecking] = useState(Boolean(auth));')
          start = text.index('  useEffect(() => {\n    if (!auth) {')
          end = text.index('\n\n  const counts = useMemo', start)
          replacement = '''  const loadBookings = useCallback(
            async (currentUser: User) => {
              setLoadingBookings(true);
              try {
                const token = await currentUser.getIdToken();
                const response = await fetch("/api/admin/bookings", {
                  headers: { authorization: `Bearer ${token}` },
                  cache: "no-store",
                });
                if (response.status === 401 || response.status === 403) {
                  await auth?.signOut();
                  router.replace("/admin/login");
                  return;
                }
                const payload = await response.json();
                setBookings(payload.bookings || []);
              } finally {
                setLoadingBookings(false);
              }
            },
            [router],
          );

          useEffect(() => {
            if (!auth) {
              router.replace("/admin/login");
              return;
            }
            return onAuthStateChanged(auth, (current) => {
              if (!current) {
                router.replace("/admin/login");
                setChecking(false);
                return;
              }
              setUser(current);
              setChecking(false);
              void loadBookings(current);
            });
          }, [loadBookings, router]);'''
          text = text[:start] + replacement + text[end:]
          text = text.replace('onClick={() => void loadBookings()}', 'onClick={() => user && void loadBookings(user)}')
          path.write_text(text, encoding='utf-8')

          # Avoid synchronous setState inside booking effects.
          path = Path('components/booking-flow-live.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '  const [dates, setDates] = useState<string[]>([]);',
              '  const dates = useMemo(() => getAvailableDates(), []);',
          )
          first_start = text.index('  useEffect(() => {\n    setDates(getAvailableDates());')
          first_end = text.index('\n\n  useEffect(() => {', first_start)
          first_replacement = '''  useEffect(() => {
            let timer: number | undefined;
            try {
              const profile = JSON.parse(localStorage.getItem("mb-customer") || "null");
              if (profile?.name && profile?.phone) {
                timer = window.setTimeout(() => {
                  setForm((current) => ({
                    ...current,
                    customerName: profile.name,
                    phone: profile.phone,
                  }));
                }, 0);
              }
            } catch {}
            return () => {
              if (timer) window.clearTimeout(timer);
            };
          }, []);'''
          text = text[:first_start] + first_replacement + text[first_end:]
          text = text.replace('    setLoadingSlots(true);\n    setError("");\n    fetch(', '    fetch(', 1)
          text = text.replace(
              '''  function next() {
            if (step === 5) void submit();
            else if (canContinue()) setStep((current) => current + 1);
          }''',
              '''  function next() {
            if (step === 5) {
              void submit();
              return;
            }
            if (!canContinue()) return;
            if (step === 2) {
              setLoadingSlots(true);
              setError("");
            }
            setStep((current) => current + 1);
          }''',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "MB CI Autofix"
          git config user.email "actions@users.noreply.github.com"
          git add components/home-page-v2.tsx components/admin/content-panel.tsx components/admin-dashboard-v2.tsx components/booking-flow-live.tsx
          git commit -m "fix: resolve React lint diagnostics [lint-autofix]"
          git push origin HEAD:feat/mb-client-ready
