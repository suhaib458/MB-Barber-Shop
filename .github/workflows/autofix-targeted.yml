name: MB Targeted Autofix

on:
  push:
    branches: [feat/mb-client-ready]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mb-client-ready
          fetch-depth: 0

      - name: Apply targeted fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in [
              'components/home-page-v2.tsx',
              'components/admin/content-panel.tsx',
          ]:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              updated = text.replace('  Instagram,\n', '  Aperture as Instagram,\n', 1)
              if updated == text:
                  raise SystemExit(f'Instagram import not found in {name}')
              path.write_text(updated, encoding='utf-8')

          service_path = Path('components/admin/services-panel.tsx')
          text = service_path.read_text(encoding='utf-8')
          marker = '    if (!db || items.length || !window.confirm("Add the six default MB services to Firebase?")) return;'
          if marker not in text:
              raise SystemExit('Services seed guard not found')
          text = text.replace(
              marker,
              '    const firestore = db;\n    if (!firestore || items.length || !window.confirm("Add the six default MB services to Firebase?")) return;',
              1,
          )
          seed_start = text.index('  async function seedDefaults() {')
          seed_end = text.index('\n  }', seed_start) + 4
          seed = text[seed_start:seed_end]
          seed = seed.replace('writeBatch(db)', 'writeBatch(firestore)')
          seed = seed.replace('doc(db, "services", id)', 'doc(firestore, "services", id)')
          text = text[:seed_start] + seed + text[seed_end:]
          service_path.write_text(text, encoding='utf-8')

          barber_path = Path('components/admin/barbers-panel.tsx')
          text = barber_path.read_text(encoding='utf-8')
          marker = '    if (!db || items.length || !window.confirm("Add the three placeholder MB barber records?")) return;'
          if marker not in text:
              raise SystemExit('Barbers seed guard not found')
          text = text.replace(
              marker,
              '    const firestore = db;\n    if (!firestore || items.length || !window.confirm("Add the three placeholder MB barber records?")) return;',
              1,
          )
          seed_start = text.index('  async function seedDefaults() {')
          seed_end = text.index('\n  }', seed_start) + 4
          seed = text[seed_start:seed_end]
          seed = seed.replace('writeBatch(db)', 'writeBatch(firestore)')
          seed = seed.replace('doc(db, "barbers", id)', 'doc(firestore, "barbers", id)')
          text = text[:seed_start] + seed + text[seed_end:]
          barber_path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "MB CI Autofix"
          git config user.email "actions@users.noreply.github.com"
          git add components/home-page-v2.tsx components/admin/content-panel.tsx components/admin/services-panel.tsx components/admin/barbers-panel.tsx
          git commit -m "fix: resolve TypeScript diagnostics [autofix]"
          git push origin HEAD:feat/mb-client-ready
